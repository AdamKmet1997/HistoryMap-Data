name: Validate Events

on:
  pull_request:
    paths:
      - 'events/**/*.json'
  push:
    branches:
      - main
    paths:
      - 'events/**/*.json'

jobs:
  validate:
    name: Validate Event JSON Files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Cache dependencies
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm install ajv ajv-formats glob

      - name: Create validation script
        run: |
          cat > validate.js << 'EOF'
          const Ajv = require('ajv');
          const addFormats = require('ajv-formats');
          const fs = require('fs');
          const path = require('path');
          const glob = require('glob');

          // Load schema
          const schema = JSON.parse(fs.readFileSync('schema.json', 'utf-8'));

          // Create validator
          const ajv = new Ajv({ allErrors: true });
          addFormats(ajv);
          const validate = ajv.compile(schema);

          // Find all event JSON files
          const eventFiles = glob.sync('events/**/*.json');

          console.log(`\n🔍 Found ${eventFiles.length} event files to validate\n`);

          let hasErrors = false;
          let validCount = 0;

          for (const file of eventFiles) {
            try {
              const data = JSON.parse(fs.readFileSync(file, 'utf-8'));
              const valid = validate(data);

              if (!valid) {
                console.error(`❌ ${file}`);
                console.error('   Errors:');
                validate.errors.forEach(err => {
                  console.error(`   - ${err.instancePath} ${err.message}`);
                });
                console.error('');
                hasErrors = true;
              } else {
                console.log(`✅ ${file}`);
                validCount++;
              }
            } catch (error) {
              console.error(`❌ ${file}`);
              console.error(`   Parse Error: ${error.message}\n`);
              hasErrors = true;
            }
          }

          console.log(`\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━`);
          console.log(`📊 Validation Summary:`);
          console.log(`   ✅ Valid: ${validCount}`);
          console.log(`   ❌ Invalid: ${eventFiles.length - validCount}`);
          console.log(`━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n`);

          if (hasErrors) {
            console.error('💥 Validation failed. Please fix the errors above.\n');
            process.exit(1);
          } else {
            console.log('✨ All events are valid!\n');
          }
          EOF

      - name: Run validation
        run: node validate.js

      - name: Check for duplicates
        run: |
          cat > check-duplicates.js << 'EOF'
          const fs = require('fs');
          const path = require('path');

          function getAllEvents() {
            const eventsDir = './events';
            const events = [];

            const countries = fs.readdirSync(eventsDir).filter(f => {
              return fs.statSync(path.join(eventsDir, f)).isDirectory();
            });

            countries.forEach(country => {
              const countryDir = path.join(eventsDir, country);
              const files = fs.readdirSync(countryDir).filter(f => f.endsWith('.json'));

              files.forEach(file => {
                const filePath = path.join(countryDir, file);
                try {
                  const event = JSON.parse(fs.readFileSync(filePath, 'utf-8'));
                  events.push({ ...event, _file: filePath });
                } catch (error) {
                  console.error(`Error reading ${filePath}:`, error.message);
                }
              });
            });

            return events;
          }

          const events = getAllEvents();
          let hasDuplicates = false;

          // Check for duplicate IDs
          const idMap = {};
          events.forEach(event => {
            if (idMap[event.id]) {
              console.error(`❌ Duplicate ID "${event.id}" found:`);
              console.error(`   - ${idMap[event.id]}`);
              console.error(`   - ${event._file}`);
              hasDuplicates = true;
            } else {
              idMap[event.id] = event._file;
            }
          });

          // Check for very similar titles (potential duplicates)
          const titleMap = {};
          events.forEach(event => {
            const normalizedTitle = event.title.toLowerCase().replace(/[^a-z0-9]/g, '');
            if (titleMap[normalizedTitle]) {
              console.warn(`⚠️  Very similar titles found (may be duplicate):`);
              console.warn(`   - ${titleMap[normalizedTitle]}: "${events.find(e => e._file === titleMap[normalizedTitle]).title}"`);
              console.warn(`   - ${event._file}: "${event.title}"`);
            } else {
              titleMap[normalizedTitle] = event._file;
            }
          });

          if (hasDuplicates) {
            console.error('\n💥 Duplicate IDs found. Please fix before merging.\n');
            process.exit(1);
          } else {
            console.log('\n✅ No duplicate IDs found\n');
          }
          EOF

          node check-duplicates.js

      - name: Validation summary
        if: success()
        run: |
          echo "✅ All validation checks passed!"
          echo "Events are ready to be merged."
